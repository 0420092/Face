[server]
# 업로드 제한 (MB). app.py의 MAX_FILE_MB와 맞춘다.
maxUploadSize = 10

[client]
# 예상치 못한 오류가 나도 브라우저에는 오류 내용·파일 경로를 보여주지 않는다 (터미널 로그에는 남음)
showErrorDetails = "none"

[theme]
font = "sans-serif"
headingFont = "Gowun Batang:https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap, serif"
baseRadius = "medium"
showSidebarBorder = true

# 한지 바탕 + 먹색 글씨 + 청동빛 금색 포인트
[theme.light]
primaryColor = "#8A5A12"
backgroundColor = "#F7F1E3"
secondaryBackgroundColor = "#EDE3CC"
textColor = "#2B2622"
borderColor = "#D9CBA8"
linkColor = "#8A5A12"

[theme.light.sidebar]
backgroundColor = "#EFE6D1"

# 먹색 바탕 + 한지색 글씨 + 금색 포인트
[theme.dark]
primaryColor = "#B07A22"
backgroundColor = "#1B1A17"
secondaryBackgroundColor = "#28251F"
textColor = "#EDE6D6"
borderColor = "#3D382E"
linkColor = "#D4A64A"

[theme.dark.sidebar]
backgroundColor = "#221F1A"
